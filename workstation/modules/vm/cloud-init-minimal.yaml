#cloud-config
# Bare VM: no packages, no tools, no repository. Only the environment variables the stacks need,
# so that once the attendee installs the tools and signs in with `az login`, the stacks need no tfvars.
write_files:
  - path: /etc/profile.d/workshop.sh
    permissions: "0644"
    content: |
      export WORKSHOP_NAME=${attendee}
      export WORKSHOP_REPO_URL=${repo_url}
      export ISTIO_VERSION=${istio_version}
      export TF_VAR_attendee=${attendee}
      export TF_VAR_location=${location}
      export TF_VAR_kubernetes_version=${kubernetes_version}
      export TF_VAR_vm_size=${aks_vm_size}
      export TF_VAR_node_count=${aks_node_count}
      export TF_VAR_delete_after=${delete_after}
      export TF_VAR_istio_version=${istio_version}
