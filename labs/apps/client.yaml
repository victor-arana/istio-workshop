apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  namespace: apps
spec:
  replicas: 1
  selector:
    matchLabels: {app: client}
  template:
    metadata:
      labels: {app: client}
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.10.1
          command: ["sleep", "infinity"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
